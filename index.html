<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>promotezz.cc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #030712;
      background-image: url('assets/bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* ==========================================================================
       HAMBURGER BUTTON (SPRING MORPH & HOVER ANIMATION)
       ========================================================================== */
    .menu-btn {
      position: fixed;
      top: max(20px, env(safe-area-inset-top, 20px));
      right: max(20px, env(safe-area-inset-right, 20px));
      z-index: 100;
      width: 48px;
      height: 48px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 0;
      touch-action: manipulation;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Tactile press response on touch / click */
    .menu-btn:active {
      transform: scale(0.88);
    }

    .menu-btn .bar {
      width: 24px;
      height: 2px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.25s ease,
                  width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.3s ease;
      transform-origin: center;
    }

    /* Subtle hover rhythm when closed */
    .menu-btn:not(.is-active):hover .bar:nth-child(1) {
      width: 26px;
      transform: translateY(-1px);
    }
    .menu-btn:not(.is-active):hover .bar:nth-child(2) {
      width: 16px;
    }
    .menu-btn:not(.is-active):hover .bar:nth-child(3) {
      width: 26px;
      transform: translateY(1px);
    }

    /* 180° Spin + Spring X Morph */
    .menu-btn.is-active {
      transform: rotate(180deg);
    }

    .menu-btn.is-active:active {
      transform: rotate(180deg) scale(0.88);
    }

    .menu-btn.is-active .bar {
      background-color: #000000;
      width: 24px !important;
    }

    .menu-btn.is-active .bar:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .menu-btn.is-active .bar:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .menu-btn.is-active .bar:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    /* ==========================================================================
       ALL-WHITE MENU (PURE WHITE, STAGGERED REVEAL)
       ========================================================================== */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 90;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(1.02);
    }

    .menu-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .menu-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 4.5vh, 40px);
    }

    .menu-link {
      font-size: clamp(2rem, 5.5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #000000;
      text-decoration: none;
      line-height: 1;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Staggered entrance for menu links */
    .menu-overlay.is-open .menu-link {
      opacity: 1;
      transform: translateY(0);
    }

    .menu-overlay.is-open .menu-link:nth-child(1) { transition-delay: 0.05s; }
    .menu-overlay.is-open .menu-link:nth-child(2) { transition-delay: 0.10s; }
    .menu-overlay.is-open .menu-link:nth-child(3) { transition-delay: 0.15s; }
    .menu-overlay.is-open .menu-link:nth-child(4) { transition-delay: 0.20s; }
    .menu-overlay.is-open .menu-link:nth-child(5) { transition-delay: 0.25s; }

    /* Instant reset on close */
    .menu-overlay:not(.is-open) .menu-link {
      transition-delay: 0s;
      opacity: 0;
      transform: translateY(16px);
    }

    .menu-link:hover,
    .menu-link:active {
      opacity: 0.45;
      transform: translateY(-2px) scale(1.03);
    }
  </style>
</head>
<body>

  <!-- Hamburger Button -->
  <button id="menu-btn" class="menu-btn" aria-label="Toggle Menu" aria-expanded="false" aria-controls="menu-overlay">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <!-- All-White Menu Overlay -->
  <div id="menu-overlay" class="menu-overlay">
    <nav class="menu-nav">
      <a href="https://stardebloater.promotezz.cc/" target="_blank" rel="noopener" class="menu-link">STARDEBLOATER</a>
      <a href="https://wiki.promotezz.cc/" target="_blank" rel="noopener" class="menu-link">WIKI</a>
      <a href="https://packed.promotezz.cc/" target="_blank" rel="noopener" class="menu-link">PACKED</a>
      <a href="https://lol.promotezz.cc/" target="_blank" rel="noopener" class="menu-link">LOL</a>
      <a href="https://github.com/promotezzz" target="_blank" rel="noopener" class="menu-link">GITHUB</a>
    </nav>
  </div>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const menuOverlay = document.getElementById('menu-overlay');

    function toggleMenu() {
      const isOpen = menuOverlay.classList.contains('is-open');
      if (isOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function openMenu() {
      menuBtn.classList.add('is-active');
      menuBtn.setAttribute('aria-expanded', 'true');
      menuOverlay.classList.add('is-open');
    }

    function closeMenu() {
      menuBtn.classList.remove('is-active');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuOverlay.classList.remove('is-open');
    }

    menuBtn.addEventListener('click', toggleMenu);

    // Keyboard support: ESC closes menu
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuOverlay.classList.contains('is-open')) {
        closeMenu();
      }
    });

    // Close menu when clicking any link
    document.querySelectorAll('.menu-link').forEach(link => {
      link.addEventListener('click', closeMenu);
    });
  </script>
</body>
</html>
