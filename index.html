<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>promotezz.cc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #030712;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: url('assets/bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: var(--font-main);
      color: #ffffff;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    /* ==========================================================================
       HAMBURGER BUTTON
       ========================================================================== */
    .menu-btn {
      position: fixed;
      top: max(18px, env(safe-area-inset-top, 18px));
      right: max(18px, env(safe-area-inset-right, 18px));
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s var(--ease-spring);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .menu-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      transform: scale(1.05);
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    /* The 3 lines of the hamburger */
    .menu-btn .bar {
      width: 20px;
      height: 2px;
      background-color: #ffffff;
      border-radius: 99px;
      transition: transform 0.32s var(--ease-spring), 
                  opacity 0.2s ease, 
                  background-color 0.2s ease;
      transform-origin: center;
      will-change: transform, opacity;
    }

    /* Morph into "X" when active */
    .menu-btn.is-active .bar:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-btn.is-active .bar:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .menu-btn.is-active .bar:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ==========================================================================
       BACKDROP OVERLAY
       ========================================================================== */
    .menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      transition: opacity 0.35s ease;
    }

    .menu-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================================================
       SLIDE-OUT DRAWER MENU
       ========================================================================== */
    .menu-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(340px, 86vw);
      background: rgba(9, 15, 30, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: -12px 0 48px rgba(0, 0, 0, 0.45);
      z-index: 90;
      display: flex;
      flex-direction: column;
      padding: max(28px, env(safe-area-inset-top, 28px)) 24px max(24px, env(safe-area-inset-bottom, 24px));
      transform: translateX(100%);
      transition: transform 0.4s var(--ease-spring);
      will-change: transform;
    }

    .menu-drawer.is-open {
      transform: translateX(0);
    }

    /* Header in Drawer */
    .drawer-header {
      padding-bottom: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-right: 48px; /* space so it doesn't collide with the X button */
    }

    .drawer-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-subtitle {
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 4px;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Navigation list */
    .drawer-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.22s var(--ease-spring);
    }

    .nav-item:hover,
    .nav-item:active {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      transform: translateX(4px);
    }

    .nav-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item-title {
      font-size: 0.95rem;
      color: #ffffff;
    }

    .nav-item-sub {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: rgba(255, 255, 255, 0.45);
      font-weight: 400;
    }

    .nav-item-arrow {
      color: rgba(255, 255, 255, 0.35);
      transition: transform 0.2s var(--ease-spring), color 0.2s ease;
    }

    .nav-item:hover .nav-item-arrow {
      color: #ffffff;
      transform: translateX(2px) translateY(-2px);
    }

    .nav-item-arrow svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* Drawer Footer */
    .drawer-footer {
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.45);
      font-family: var(--font-mono);
    }

    .drawer-footer a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .drawer-footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Hamburger Toggle Button -->
  <button id="menu-btn" class="menu-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="menu-drawer">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>

  <!-- Backdrop for clicking outside -->
  <div id="menu-backdrop" class="menu-backdrop" aria-hidden="true"></div>

  <!-- Slide-Out Navigation Drawer -->
  <aside id="menu-drawer" class="menu-drawer" aria-label="Main Navigation">
    
    <div class="drawer-header">
      <div class="drawer-title">promotezz.cc</div>
      <div class="drawer-subtitle">Ecosystem Navigation</div>
    </div>

    <nav class="drawer-nav">
      
      <!-- StarDebloater -->
      <a href="https://stardebloater.promotezz.cc/" target="_blank" rel="noopener" class="nav-item">
        <div class="nav-item-info">
          <span class="nav-item-title">StarDebloater</span>
          <span class="nav-item-sub">stardebloater.promotezz.cc</span>
        </div>
        <div class="nav-item-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </div>
      </a>

      <!-- Wiki -->
      <a href="https://wiki.promotezz.cc/" target="_blank" rel="noopener" class="nav-item">
        <div class="nav-item-info">
          <span class="nav-item-title">Wiki</span>
          <span class="nav-item-sub">wiki.promotezz.cc</span>
        </div>
        <div class="nav-item-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </div>
      </a>

      <!-- Packed -->
      <a href="https://packed.promotezz.cc/" target="_blank" rel="noopener" class="nav-item">
        <div class="nav-item-info">
          <span class="nav-item-title">Packed</span>
          <span class="nav-item-sub">packed.promotezz.cc</span>
        </div>
        <div class="nav-item-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </div>
      </a>

      <!-- LOL -->
      <a href="https://lol.promotezz.cc/" target="_blank" rel="noopener" class="nav-item">
        <div class="nav-item-info">
          <span class="nav-item-title">LOL</span>
          <span class="nav-item-sub">lol.promotezz.cc</span>
        </div>
        <div class="nav-item-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </div>
      </a>

      <!-- GitHub & Labs -->
      <a href="https://github.com/promotezzz" target="_blank" rel="noopener" class="nav-item">
        <div class="nav-item-info">
          <span class="nav-item-title">GitHub</span>
          <span class="nav-item-sub">github.com/promotezzz</span>
        </div>
        <div class="nav-item-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </div>
      </a>

    </nav>

    <div class="drawer-footer">
      <span>promotezz &copy; 2026</span>
      <a href="https://github.com/promotezzz" target="_blank" rel="noopener">GitHub &rarr;</a>
    </div>

  </aside>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const menuDrawer = document.getElementById('menu-drawer');
    const menuBackdrop = document.getElementById('menu-backdrop');

    function toggleMenu() {
      const isOpen = menuDrawer.classList.contains('is-open');
      if (isOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function openMenu() {
      menuBtn.classList.add('is-active');
      menuBtn.setAttribute('aria-expanded', 'true');
      menuDrawer.classList.add('is-open');
      menuBackdrop.classList.add('is-open');
      document.body.classList.add('menu-open');
    }

    function closeMenu() {
      menuBtn.classList.remove('is-active');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuDrawer.classList.remove('is-open');
      menuBackdrop.classList.remove('is-open');
      document.body.classList.remove('menu-open');
    }

    // Click triggers
    menuBtn.addEventListener('click', toggleMenu);
    menuBackdrop.addEventListener('click', closeMenu);

    // Keyboard support: ESC closes menu
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuDrawer.classList.contains('is-open')) {
        closeMenu();
      }
    });

    // Close menu when clicking any nav link
    document.querySelectorAll('.nav-item').forEach(link => {
      link.addEventListener('click', () => {
        closeMenu();
      });
    });
  </script>
</body>
</html>
